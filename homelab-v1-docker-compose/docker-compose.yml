services:

  # ──────────────────────────────────────────────
  # Portainer — painel web para gerenciar os containers
  # ──────────────────────────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - homelab

  # ──────────────────────────────────────────────
  # Nextcloud — nuvem pessoal (arquivos, calendário, contatos)
  # ──────────────────────────────────────────────
  nextcloud_db:
    image: mariadb:11
    container_name: nextcloud_db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - nextcloud_db_data:/var/lib/mysql
    networks:
      - homelab

  nextcloud_redis:
    image: redis:alpine
    container_name: nextcloud_redis
    restart: unless-stopped
    networks:
      - homelab

  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      MYSQL_HOST: nextcloud_db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      REDIS_HOST: nextcloud_redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${SERVER_IP}
    volumes:
      - nextcloud_data:/var/www/html
    depends_on:
      - nextcloud_db
      - nextcloud_redis
    networks:
      - homelab

  # ──────────────────────────────────────────────
  # Gitea — servidor Git leve (alternativa ao GitHub/GitLab)
  # ──────────────────────────────────────────────
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: sqlite3
    ports:
      - "3000:3000"   # interface web
      - "2222:22"     # SSH do git (não usa a 22 para não conflitar com o SSH do sistema)
    volumes:
      - gitea_data:/data
    networks:
      - homelab

  # ──────────────────────────────────────────────
  # Navidrome — servidor de música (compatível com Subsonic, apps como Symfonium/play:Sub)
  # ──────────────────────────────────────────────
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
    volumes:
      - navidrome_data:/data
      - ${MUSIC_PATH}:/music:ro
    networks:
      - homelab

volumes:
  portainer_data:
  nextcloud_db_data:
  nextcloud_data:
  gitea_data:
  navidrome_data:

networks:
  homelab:
    driver: bridge
