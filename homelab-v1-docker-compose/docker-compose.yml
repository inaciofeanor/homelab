services:

  # ──────────────────────────────────────────────
  # Portainer — painel web para gerenciar os containers
  # ──────────────────────────────────────────────
  portainer:
    image: portainer/portainer-ce:latest@sha256:511f3f06c96fe3b993ebeaafde311c1959cae73a7ef825dba6397d51b450dffa
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - homelab

  # ──────────────────────────────────────────────
  # Nextcloud — nuvem pessoal (arquivos, calendário, contatos)
  # ──────────────────────────────────────────────
  nextcloud_db:
    image: mariadb:11@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3
    container_name: nextcloud_db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - nextcloud_db_data:/var/lib/mysql
    networks:
      - homelab

  nextcloud_redis:
    image: redis:alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    container_name: nextcloud_redis
    restart: unless-stopped
    networks:
      - homelab

  nextcloud:
    image: nextcloud:latest@sha256:0b8261f6335af6b95264ce893b4d645857638e0fa151b5ba620f25f377318ae1
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      MYSQL_HOST: nextcloud_db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      REDIS_HOST: nextcloud_redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${SERVER_IP}
    volumes:
      - nextcloud_data:/var/www/html
    depends_on:
      - nextcloud_db
      - nextcloud_redis
    networks:
      - homelab

  # ──────────────────────────────────────────────
  # Gitea — servidor Git leve (alternativa ao GitHub/GitLab)
  # ──────────────────────────────────────────────
  gitea:
    image: gitea/gitea:latest@sha256:87a67ee09d3ae0d1df5fda5dcda3e2a1f9236a45b0a59025d6e00e46adc43bef
    container_name: gitea
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: sqlite3
    ports:
      - "3000:3000"   # interface web
      - "2222:22"     # SSH do git (não usa a 22 para não conflitar com o SSH do sistema)
    volumes:
      - gitea_data:/data
    networks:
      - homelab

  # ──────────────────────────────────────────────
  # Navidrome — servidor de música (compatível com Subsonic, apps como Symfonium/play:Sub)
  # ──────────────────────────────────────────────
  navidrome:
    image: deluan/navidrome:latest@sha256:9012939114fbb1bb641b81cf96dec5ded15f0aafefe8d47a511d7cb919658e40
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
    volumes:
      - navidrome_data:/data
      - ${MUSIC_PATH}:/music:ro
    networks:
      - homelab

volumes:
  portainer_data:
  nextcloud_db_data:
  nextcloud_data:
  gitea_data:
  navidrome_data:

networks:
  homelab:
    driver: bridge
