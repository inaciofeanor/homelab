name: Build Canary MyAAC

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/canary-myaac-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Canary build context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opentibiabr/canary
          ref: d618a61ab880eca6b28ab48caef8409737e59537
          path: canary

      - name: Login no GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Construir e publicar MyAAC
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: canary/docker
          file: canary/docker/quickstart/myaac/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            MYAAC_REF=944d8852b4904b530b1cdfa960f2c69546573562
          tags: ghcr.io/inaciofeanor/homelab-canary-myaac:canary-3.6.1
          provenance: true
          sbom: true
