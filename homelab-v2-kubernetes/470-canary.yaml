      labels:
        app: canary-myaac
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: myaac
          image: ghcr.io/inaciofeanor/homelab-canary-myaac:canary-3.6.1@sha256:40d76f2b472dc772bb2286cf18a69b11e4f35d96fa86b7bb4f9de56093958922
          imagePullPolicy: IfNotPresent
          env:
            - {name: CANARY_DB_HOST, value: canary-db}
            - {name: CANARY_DB_PORT, value: "3306"}
            - {name: CANARY_DB_NAME, value: canary}
            - {name: CANARY_DB_USER, value: canary}
            - name: CANARY_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: canary-secrets, key: DB_PASSWORD}
            - {name: CANARY_SERVER_NAME, value: Feanor Canary}
            - {name: CANARY_SERVER_IP, value: "192.168.0.23"}
            - {name: CANARY_SERVER_LOCATION, value: BRA}
            - {name: CANARY_LOGIN_PORT, value: "7171"}
            - {name: CANARY_GAME_PORT, value: "7172"}
            - {name: CANARY_STATUS_PORT, value: "7173"}
            - {name: CANARY_STATUS_TIMEOUT, value: "5000"}
            - {name: CANARY_DATA_PACK, value: data-otservbr-global}
            - {name: MYAAC_SITE_URL, value: "http://192.168.0.23:30086"}
            - {name: MYAAC_ADMIN_ACCOUNT, value: canaryadmin}
            - {name: MYAAC_ADMIN_EMAIL, value: admin@feanor.com.br}
            - name: MYAAC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: canary-secrets, key: MYAAC_ADMIN_PASSWORD}
            - {name: MYAAC_ADMIN_PLAYER, value: ADM1}
            - {name: MYAAC_CLIENT_VERSION, value: "1513"}
            - {name: MYAAC_TIMEZONE, value: America/Sao_Paulo}
          ports:
            - {name: http, containerPort: 80}
          resources:
            requests: {cpu: 10m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata: {name: canary-myaac, namespace: homelab}
spec:
  type: NodePort
  selector: {app: canary-myaac}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30086}
