apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: homelab
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gitea
          image: gitea/gitea@sha256:34e3f6b75f5cbb6aebce588037fc5a53c84213e4d4b00da0a8d73e031a558e52
          imagePullPolicy: IfNotPresent
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: GITEA__database__DB_TYPE
              value: sqlite3
          ports:
            - containerPort: 3000
            - containerPort: 22
          resources:
            requests:
              cpu: 100m        # era 250m
              memory: 256Mi
            limits:
              cpu: 500m         # novo
              memory: 512Mi
          securityContext:
            # O entrypoint (s6-overlay) da imagem oficial precisa iniciar
            # como root para ajustar a permissão de /data para o
            # USER_UID/USER_GID configurados acima, e depois baixa
            # privilégio para o processo "git" (setuid/setgid). Forçar
            # runAsNonRoot ou restringir capabilities aqui quebra esse
            # ajuste inicial.
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
---
# Interface web — vai atrás do Traefik via Ingress
apiVersion: v1
kind: Service
metadata:
  name: gitea-http
  namespace: homelab
spec:
  selector:
    app: gitea
  ports:
    - port: 3000
      targetPort: 3000
---
# SSH (git clone/push) — Traefik só lida com HTTP(S) por padrão,
# então o SSH é exposto direto via NodePort, sem passar pelo Ingress
apiVersion: v1
kind: Service
metadata:
  name: gitea-ssh
  namespace: homelab
spec:
  type: NodePort
  selector:
    app: gitea
  ports:
    - port: 22
      targetPort: 22
      nodePort: 30022
