apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rathena-db-data
  namespace: homelab
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rathena-db
  namespace: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rathena-db
  template:
    metadata:
      labels:
        app: rathena-db
    spec:
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: database-schema
          image: ghcr.io/inaciofeanor/homelab-rathena:packetver-20211103@sha256:4a76a0b1f82d72e9571f3e8203e6ababf882582969b7dd87c5d6cb08e35f599f
          imagePullPolicy: IfNotPresent
          command: [sh, -ec]
          args:
            - |
              cp /rathena/sql-files/main.sql /init/01-main.sql
              cp /rathena/sql-files/logs.sql /init/02-logs.sql
              cp /rathena/sql-files/web.sql /init/03-web.sql
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: initdb, mountPath: /init}
      containers:
        - name: mariadb
          image: mariadb:11.4.13@sha256:611a2fcc5fa7c6ceb8644c6f74b25ede004ff6c3a6b38c8f8c23d3bbf6c26430
          imagePullPolicy: IfNotPresent
          env:
            - {name: MARIADB_DATABASE, value: ragnarok}
            - {name: MARIADB_USER, value: ragnarok}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: {name: rathena-secrets, key: DB_PASSWORD}
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: rathena-secrets, key: DB_ROOT_PASSWORD}
          ports:
            - {name: mariadb, containerPort: 3306}
          resources:
            requests: {cpu: 25m, memory: 256Mi}
            limits: {cpu: 750m, memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
          startupProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: rathena-db-data}
        - name: initdb
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: rathena-db, namespace: homelab}
spec:
  selector: {app: rathena-db}
  ports:
    - {name: mariadb, port: 3306, targetPort: mariadb}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rathena
  namespace: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rathena
  template:
    metadata:
      labels:
        app: rathena
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rathena
          image: ghcr.io/inaciofeanor/homelab-rathena:packetver-20211103@sha256:4a76a0b1f82d72e9571f3e8203e6ababf882582969b7dd87c5d6cb08e35f599f
          imagePullPolicy: IfNotPresent
          env:
            - {name: DB_HOST, value: rathena-db}
            - {name: DB_PORT, value: "3306"}
            - {name: DB_NAME, value: ragnarok}
            - {name: DB_USER, value: ragnarok}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: rathena-secrets, key: DB_PASSWORD}
            - {name: SERVER_NAME, value: Feanor Ragnarok}
            - {name: PUBLIC_IP, value: "192.168.0.23"}
          ports:
            - {name: login, containerPort: 6900}
            - {name: char, containerPort: 6121}
            - {name: map, containerPort: 5121}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          startupProbe:
            tcpSocket: {port: login}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/6900 && exec 4<>/dev/tcp/127.0.0.1/6121 && exec 5<>/dev/tcp/127.0.0.1/5121"]
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket: {port: login}
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rathena
  namespace: homelab
spec:
  type: LoadBalancer
  selector: {app: rathena}
  ports:
    - {name: login, port: 6900, targetPort: login, protocol: TCP}
    - {name: char, port: 6121, targetPort: char, protocol: TCP}
    - {name: map, port: 5121, targetPort: map, protocol: TCP}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxcp
  namespace: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fluxcp
  template:
    metadata:
      labels:
        app: fluxcp
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fluxcp
          image: ghcr.io/inaciofeanor/homelab-fluxcp:master-20260908-r1@sha256:efdaa0d4a8579f48a984f2d8630070bbe83ad25daea9a60aea6a95e96f4285fd
          imagePullPolicy: IfNotPresent
          env:
            - {name: DB_HOST, value: rathena-db}
            - {name: DB_PORT, value: "3306"}
            - {name: DB_NAME, value: ragnarok}
            - {name: DB_USER, value: ragnarok}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: rathena-secrets, key: DB_PASSWORD}
            - {name: FLUX_SERVER_ADDRESS, value: ragnarok.feanor.com.br}
            - name: FLUX_INSTALLER_PASSWORD
              valueFrom:
                secretKeyRef: {name: rathena-secrets, key: FLUX_INSTALLER_PASSWORD}
          ports:
            - {name: http, containerPort: 80}
          resources:
            requests: {cpu: 10m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata: {name: fluxcp, namespace: homelab}
spec:
  selector: {app: fluxcp}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fluxcp
  namespace: homelab
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "rAthena"
    gethomepage.dev/description: "Servidor Ragnarok Online"
    gethomepage.dev/group: "Mídia e Jogos"
    gethomepage.dev/icon: "ragnarok-online.png"
    gethomepage.dev/pod-selector: "app=fluxcp"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [ragnarok.feanor.com.br]
      secretName: feanor-wildcard-tls
  rules:
    - host: ragnarok.feanor.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fluxcp
                port: {number: 80}
