apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: vikunja-db-data, namespace: homelab}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests: {storage: 2Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: vikunja-files, namespace: homelab}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: vikunja-db, namespace: homelab}
spec:
  replicas: 1
  selector:
    matchLabels: {app: vikunja-db}
  template:
    metadata:
      labels: {app: vikunja-db}
    spec:
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17.11-alpine@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee
          imagePullPolicy: IfNotPresent
          env:
            - {name: POSTGRES_DB, value: vikunja}
            - {name: POSTGRES_USER, value: vikunja}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: vikunja-secrets, key: DB_PASSWORD}
          ports:
            - {name: postgres, containerPort: 5432}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 300m, memory: 384Mi}
          securityContext: {allowPrivilegeEscalation: false}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "vikunja", "-d", "vikunja"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: vikunja-db-data}
---
apiVersion: v1
kind: Service
metadata: {name: vikunja-db, namespace: homelab}
spec:
  selector: {app: vikunja-db}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: vikunja, namespace: homelab}
spec:
  replicas: 1
  selector:
    matchLabels: {app: vikunja}
  template:
    metadata:
      labels: {app: vikunja}
    spec:
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-for-database
          image: postgres:17.11-alpine@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec", "until pg_isready -h vikunja-db -U vikunja -d vikunja; do sleep 2; done"]
      containers:
        - name: vikunja
          image: vikunja/vikunja:2.6.0@sha256:b63e4d5d300dbd63003c045afa1ebb98a16ff2a527ef09550cc8df2db57706e2
          imagePullPolicy: IfNotPresent
          env:
            - {name: VIKUNJA_SERVICE_PUBLICURL, value: "https://tarefas.feanor.com.br/"}
            - {name: VIKUNJA_SERVICE_TIMEZONE, value: America/Sao_Paulo}
            - {name: VIKUNJA_SERVICE_ENABLEREGISTRATION, value: "true"}
            - {name: VIKUNJA_DATABASE_TYPE, value: postgres}
            - {name: VIKUNJA_DATABASE_HOST, value: vikunja-db}
            - {name: VIKUNJA_DATABASE_DATABASE, value: vikunja}
            - {name: VIKUNJA_DATABASE_USER, value: vikunja}
            - name: VIKUNJA_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: {name: vikunja-secrets, key: DB_PASSWORD}
          ports:
            - {name: http, containerPort: 3456}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: {path: /api/v1/info, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - {name: files, mountPath: /app/vikunja/files}
      volumes:
        - name: files
          persistentVolumeClaim: {claimName: vikunja-files}
---
apiVersion: v1
kind: Service
metadata: {name: vikunja, namespace: homelab}
spec:
  selector: {app: vikunja}
  ports:
    - {name: http, port: 3456, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vikunja
  namespace: homelab
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Vikunja
    gethomepage.dev/description: Tarefas e projetos
    gethomepage.dev/group: Principal
    gethomepage.dev/icon: vikunja.png
    gethomepage.dev/pod-selector: app=vikunja
spec:
  ingressClassName: traefik
  tls:
    - hosts: [tarefas.feanor.com.br]
      secretName: feanor-wildcard-tls
  rules:
    - host: tarefas.feanor.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vikunja
                port: {number: 3456}
