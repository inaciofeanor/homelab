apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-data
  namespace: homelab
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-bootstrap
  namespace: homelab
data:
  configuration.yaml: |
    default_config:

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.0.0/16
        - 10.43.0.0/16
      ip_ban_enabled: true
      login_attempts_threshold: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap-configuration
          image: ghcr.io/home-assistant/home-assistant:2026.8.3@sha256:14931c6b13756317849f46da1d01b45937a1150db66c081cfe529d48215943fe
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ ! -f /config/configuration.yaml ]; then
                cp /bootstrap/configuration.yaml /config/configuration.yaml
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /config
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.8.3@sha256:14931c6b13756317849f46da1d01b45937a1150db66c081cfe529d48215943fe
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Sao_Paulo
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /config
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: home-assistant-data
        - name: bootstrap
          configMap:
            name: home-assistant-bootstrap
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: homelab
spec:
  selector:
    app: home-assistant
  ports:
    - name: http
      port: 8123
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
  namespace: homelab
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Home Assistant"
    gethomepage.dev/description: "Automação residencial"
    gethomepage.dev/group: "Principal"
    gethomepage.dev/icon: "home-assistant.png"
    gethomepage.dev/pod-selector: "app=home-assistant"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - casa.feanor.com.br
      secretName: feanor-wildcard-tls
  rules:
    - host: casa.feanor.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant
                port:
                  number: 8123
