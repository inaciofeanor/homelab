apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-cleanup
  namespace: homelab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-cleanup
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-cleanup
subjects:
  - kind: ServiceAccount
    name: pod-cleanup
    namespace: homelab
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-cleanup
  namespace: homelab
spec:
  schedule: "0 9 * * *"
  timeZone: "America/Sao_Paulo"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: pod-cleanup
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: rancher/k3s:v1.35.7-k3s1@sha256:eb7156a0bf9867ffac1afc6d55f453175b2f6c785627b786540df863014a56e7
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |
                  echo "Removendo pods concluídos..."
                  kubectl delete pods -A --field-selector=status.phase=Succeeded --ignore-not-found --wait=false

                  echo "Removendo pods evacuados..."
                  kubectl get pods -A --field-selector=status.phase=Failed \
                    -o jsonpath='{range .items[?(@.status.reason=="Evicted")]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
                  | while read -r namespace pod; do
                      [ -n "$namespace" ] && kubectl delete pod -n "$namespace" "$pod" --ignore-not-found --wait=false
                    done
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
