apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homelab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["traefik.io", "traefik.containo.us"]
    resources: ["ingressroutes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homelab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homelab
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Meu Homelab
    description: Serviços, mídia e administração do ambiente
    language: pt
    theme: dark
    color: zinc
    background:
      image: /images/dashboard-background.png
      brightness: 45
      saturate: 50
      opacity: 55
    headerStyle: boxedWidgets
    iconStyle: theme
    showStats: true
    useEqualHeights: true
    layout:
      Principal:
        style: row
        columns: 4
        icon: mdi-apps
        tab: Aplicações
      Mídia e Jogos:
        style: row
        columns: 4
        icon: mdi-multimedia
        tab: Aplicações
      Administração:
        style: row
        columns: 4
        icon: mdi-server-cog
        tab: Sistema
      Monitoramento:
        style: row
        columns: 4
        icon: mdi-chart-line
        tab: Sistema
  widgets.yaml: |
    - datetime:
        text_size: xl
        locale: pt-BR
        format:
          dateStyle: medium
          timeStyle: short
          hourCycle: h23
        timeZone: America/Sao_Paulo
    - resources:
        backend: resources
        label: Armazenamento
        expanded: true
        disk:
          - /host-root
          - /mnt/dados-homelab-novo
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "Cluster"
        nodes:
          show: false
          cpu: true
          memory: true
          showLabel: true
          label: "Node"
    - search:
        provider: duckduckgo
        target: _blank
  # Vazios de propósito: todos os serviços são descobertos automaticamente
  # via anotações gethomepage.dev/* nos Ingress (veja os outros manifests).
  services.yaml: "[]"
  bookmarks.yaml: "[]"
  docker.yaml: ""
  custom.css: |
    html, body {
      background: #05070a !important;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 50% -20%, rgba(80, 94, 108, 0.45), transparent 48%),
        radial-gradient(circle at 10% 90%, rgba(36, 51, 64, 0.35), transparent 42%),
        linear-gradient(145deg, #030405 0%, #11151a 50%, #05070a 100%);
    }
    .service, .bookmark, .widget {
      border-color: rgba(148, 163, 184, 0.16) !important;
      background-color: rgba(15, 20, 26, 0.72) !important;
      backdrop-filter: blur(10px);
    }
---
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homepage-assets
  namespace: homelab
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.3.0@sha256:913a68a2fb4527334b7dd881d1cd21e9535bf97d9d2e13144b13ef46ad72caa8
          imagePullPolicy: IfNotPresent
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "home.feanor.com.br"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m          # era 100m
              memory: 128Mi
            limits:
              cpu: 200m         # novo
              memory: 256Mi
          securityContext:
            # Só lê a API do cluster e arquivos de config montados via
            # ConfigMap (somente leitura) — não persiste nada em disco,
            # então este é o serviço mais seguro de travar por completo.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - mountPath: /app/config/kubernetes.yaml
              name: homepage-config
              subPath: kubernetes.yaml
            - mountPath: /app/config/settings.yaml
              name: homepage-config
              subPath: settings.yaml
            - mountPath: /app/config/widgets.yaml
              name: homepage-config
              subPath: widgets.yaml
            - mountPath: /app/config/services.yaml
              name: homepage-config
              subPath: services.yaml
            - mountPath: /app/config/bookmarks.yaml
              name: homepage-config
              subPath: bookmarks.yaml
            - mountPath: /app/config/docker.yaml
              name: homepage-config
              subPath: docker.yaml
            - mountPath: /app/config/custom.css
              name: homepage-config
              subPath: custom.css
            - mountPath: /app/public/images
              name: homepage-assets
            - mountPath: /host-root
              name: host-root
              readOnly: true
            - mountPath: /mnt/dados-homelab-novo
              name: dados-homelab-novo
              readOnly: true
      volumes:
        - name: homepage-config
          configMap:
            name: homepage-config
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: dados-homelab-novo
          hostPath:
            path: /mnt/dados-homelab-novo
            type: Directory
        - name: homepage-assets
          persistentVolumeClaim:
            claimName: homepage-assets
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homelab
spec:
  selector:
    app: homepage
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homelab
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Homepage"
    gethomepage.dev/description: "Painel principal"
    gethomepage.dev/group: "Administração"
    gethomepage.dev/icon: "homepage.png"
    gethomepage.dev/pod-selector: "app=homepage"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - home.feanor.com.br
      secretName: feanor-wildcard-tls
  rules:
    - host: home.feanor.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
