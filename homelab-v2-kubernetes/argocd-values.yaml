# Helm chart: argo/argo-cd 10.2.2 (Argo CD v3.4.6)
# Perfil enxuto para o cluster k3s de no unico.

global:
  domain: argocd.feanor.com.br

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  replicas: 0

controller:
  resources:
    requests: {cpu: 30m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

repoServer:
  resources:
    requests: {cpu: 30m, memory: 128Mi}
    limits: {cpu: 300m, memory: 256Mi}

redis:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {cpu: 100m, memory: 128Mi}

server:
  resources:
    requests: {cpu: 20m, memory: 128Mi}
    limits: {cpu: 200m, memory: 256Mi}
  extraArgs:
    - --insecure
  ingress:
    enabled: true
    controller: generic
    ingressClassName: traefik
    hostname: argocd.feanor.com.br
    path: /
    pathType: Prefix
    tls: false
    extraTls:
      - hosts:
          - argocd.feanor.com.br
        secretName: feanor-wildcard-tls
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Argo CD"
      gethomepage.dev/description: "GitOps - deploy das aplicacoes"
      gethomepage.dev/group: "Administracao"
      gethomepage.dev/icon: "argocd.png"
      gethomepage.dev/pod-selector: "app.kubernetes.io/name=argocd-server"

configs:
  params:
    server.insecure: true
